<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Address | Global Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 12% 10%, rgba(21, 128, 61, 0.04) 0 16%, transparent 38%),
                radial-gradient(circle at 88% 8%, rgba(21, 128, 61, 0.03) 0 14%, transparent 30%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 18px 40px; 
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            border: 1px solid rgba(22, 101, 52, 0.12);
            backdrop-filter: blur(18px) saturate(150%);
            margin-bottom: 30px;
        }
        
        .logo { 
            font-weight: 700; 
            font-size: 1.8em; 
            color: #14532d; 
            text-decoration: none;
            letter-spacing: 1px;
        }
        
        .header-nav div { display: flex; align-items: center; gap: 12px; }
        
        .content-wrapper {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 0 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            border: 1px solid rgba(22, 101, 52, 0.12);
            backdrop-filter: blur(18px) saturate(150%);
        }
        
        h1 {
            color: #14532d;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            color: #475569;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .form-section h3 {
            color: #14532d;
            margin-bottom: 20px;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            color: #14532d;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-radius: 6px;
            font-size: 0.95em;
            font-family: inherit;
            transition: all 0.3s;
            background: rgba(249, 250, 251, 0.94);
            color: #14532d;
        }
        
        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: rgba(22, 101, 52, 0.24);
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.12);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, rgba(22, 101, 52, 0.92), rgba(34, 197, 94, 0.92));
            color: #ffffff;
            flex: 1;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: rgba(249, 250, 251, 0.94);
            color: #14532d;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        
        .success-msg {
            background: rgba(249, 250, 251, 0.94);
            color: #14532d;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid rgba(22, 101, 52, 0.28);
        }
        
        footer.site-footer {
            margin-top: auto;
            background: transparent;
            color: #6b7280;
            text-align: center;
            padding: 12px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0;
            border-top: none;
            box-shadow: none;
            
        }
        
        @media (max-width: 768px) {
            .header-nav {
                padding: 12px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .logo {
                font-size: 1.3em;
                width: 100%;
                text-align: center;
            }

            .header-nav div {
                width: 100%;
                justify-content: center;
            }

            .content-wrapper {
                padding: 0 15px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.4em;
            }

            .subtitle {
                font-size: 0.9em;
            }

            .form-section {
                margin-bottom: 20px;
            }

            .form-section h3 {
                font-size: 1em;
            }

            .form-group {
                margin-bottom: 14px;
            }

            label {
                font-size: 0.9em;
            }

            input[type="text"],
            textarea {
                padding: 10px;
                font-size: 0.9em;
            }

            .form-row {
                gap: 12px;
            }

            .button-group {
                gap: 10px;
            }

            .btn {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            footer {
                padding: 20px 15px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .header-nav {
                padding: 10px;
                flex-direction: column;
                gap: 8px;
            }

            .logo {
                font-size: 1em;
                width: 100%;
            }

            .header-nav div {
                width: 100%;
                justify-content: center;
            }

            .content-wrapper {
                padding: 0 10px;
            }

            .container {
                padding: 12px;
                margin-bottom: 20px;
            }

            h1 {
                font-size: 1.1em;
            }

            .subtitle {
                font-size: 0.8em;
                margin-bottom: 15px;
            }

            .form-section {
                margin-bottom: 15px;
            }

            .form-section h3 {
                font-size: 0.9em;
                margin-bottom: 10px;
            }

            .form-group {
                margin-bottom: 12px;
            }

            label {
                font-size: 0.85em;
                margin-bottom: 3px;
            }

            input[type="text"],
            textarea {
                width: 100%;
                padding: 9px;
                font-size: 14px;
            }

            textarea {
                min-height: 70px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .button-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin-top: 15px;
            }

            .btn {
                padding: 10px 15px;
                font-size: 0.9em;
                width: 100%;
            }

            footer.site-footer {
                padding: 12px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="header-nav">
        <a href="/" class="logo">Global Mart</a>
        <div>
            <a href="{% url 'profile' %}" style="color: #14532d; text-decoration: none; font-weight: 500;">Back to Profile</a>
        </div>
        </div>

    <div class="content-wrapper">
        <div class="container">
            <h1>{% if address %}Edit{% else %}Add{% endif %} Delivery Address</h1>
            <p class="subtitle">Keep your address updated for smooth delivery</p>
            
            <form method="POST" action="">
                {% csrf_token %}
                
                <!-- Personal Information -->
                <div class="form-section">
                    <h3>Personal Information</h3>
                    
                    <div class="form-group">
                        <label for="full_name">Full Name *</label>
                        <input type="text" name="full_name" id="full_name" placeholder="Enter your full name" value="{{ address.full_name|default:'' }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="text" name="phone" id="phone" placeholder="Enter phone number" value="{{ address.phone|default:'' }}" required>
                    </div>
                </div>
                
                <!-- Address Information -->
                <div class="form-section">
                    <h3>Address Information</h3>
                    
                    <div class="form-group">
                        <label for="street_address">Street Address *</label>
                        <textarea name="street_address" id="street_address" placeholder="House No., Building, Apartment, Road Name" required>{{ address.street_address|default:'' }}</textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="landmark">Landmark (Optional)</label>
                        <input type="text" name="landmark" id="landmark" placeholder="e.g., Near Central Mall, Next to School" value="{{ address.landmark|default:'' }}">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" name="city" id="city" placeholder="Enter city name" value="{{ address.city|default:'' }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="pin_code">PIN Code *</label>
                            <input type="text" name="pin_code" id="pin_code" placeholder="Enter PIN code" value="{{ address.pin_code|default:'' }}" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="state">State *</label>
                        <input type="text" name="state" id="state" placeholder="Enter state name" value="{{ address.state|default:'' }}" required>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="button-group">
                    <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">{% if address %}Update{% else %}Save{% endif %} Address</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer">Global Mart</footer>

</body>
</html>
