<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Global Mart</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Outfit', sans-serif; 
            background:
                radial-gradient(circle at 14% 12%, rgba(214, 180, 108, 0.22) 0 12%, transparent 28%),
                radial-gradient(circle at 82% 14%, rgba(245, 214, 164, 0.26) 0 10%, transparent 24%),
                linear-gradient(180deg, #fffaf2 0%, #f4eadb 100%);
            display: flex; 
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
        }

        .center-shell {
            flex: 1;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .success-card { 
            background: rgba(255, 255, 255, 0.96); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 24px 48px rgba(0,0,0,0.2); 
            text-align: center;
            max-width: 450px; 
            width: 100%;
            backdrop-filter: blur(18px) saturate(150%);
            border: 1px solid rgba(22, 101, 52, 0.12);
        }
        
        /* Added a small pulse animation for the checkmark */
        .icon-circle { 
            width: 80px; 
            height: 80px; 
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
            color: #14532d; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 3em; 
            margin: 0 auto 25px;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 { 
            color: #14532d; 
            margin-bottom: 15px;
            font-size: 2em;
        }
        
        p { 
            color: #475569; 
            line-height: 1.6; 
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .payment-meta {
            margin: -8px 0 24px;
            color: #14532d;
            font-size: 0.9em;
        }

        .payment-chip {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(22, 101, 52, 0.12);
            border: 1px solid rgba(22, 101, 52, 0.18);
            font-weight: 500;
        }
        
        .btn-group { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        
        .btn { 
            padding: 14px 25px; 
            border-radius: 6px; 
            border: none; 
            cursor: pointer; 
            text-decoration: none; 
            font-size: 1em; 
            transition: all 0.3s; 
            font-weight: 500; 
            text-align: center;
        }
        
        .btn-home { 
            background: linear-gradient(135deg, rgba(22, 101, 52, 0.92), rgba(34, 197, 94, 0.92));
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2);
        }
        
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.3);
        }
        
        .btn-orders { 
            background: rgba(249, 250, 251, 0.94);
            color: #14532d; 
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-orders:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
        }

        footer.site-footer {
            margin-top: auto;
            background: transparent;
            color: #6b7280;
            text-align: center;
            padding: 12px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0;
            border-top: none;
            box-shadow: none;
            
        }

        /* Tablet Responsive (max-width: 768px) */
        @media (max-width: 768px) {
            .success-card {
                padding: 25px;
            }

            .icon-circle {
                width: 70px;
                height: 70px;
                font-size: 2.5em;
                margin: 0 auto 20px;
            }

            h1 {
                font-size: 1.6em;
                margin-bottom: 12px;
            }

            p {
                font-size: 0.9em;
                margin-bottom: 25px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 0.95em;
            }
        }

        /* Mobile Responsive (max-width: 480px) */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .success-card {
                padding: 20px;
                border-radius: 10px;
            }

            .icon-circle {
                width: 60px;
                height: 60px;
                font-size: 2em;
                margin: 0 auto 15px;
            }

            h1 {
                font-size: 1.3em;
                margin-bottom: 10px;
            }

            p {
                font-size: 0.85em;
                margin-bottom: 20px;
                line-height: 1.5;
            }

            .btn-group {
                gap: 10px;
            }

            .btn {
                padding: 12px 18px;
                font-size: 0.9em;
                border-radius: 5px;
            }
        }
    </style>
</head>
<body>

    <main class="center-shell">
        <div class="success-card">
            <div class="icon-circle">OK</div>
            <h1>Success!</h1>
            <p>Your order has been placed successfully. Thank you for shopping with <strong>Global Mart</strong>. We are now processing your items for delivery!</p>
            {% if payment_method %}
                <div class="payment-meta">Payment Method: <span class="payment-chip">{{ payment_method }}</span></div>
            {% endif %}
            
            <div class="btn-group">
                <a href="{% url 'product_list' %}" class="btn btn-home">Continue Shopping</a>
                <a href="{% url 'profile' %}" class="btn btn-orders">View My Orders</a>
            </div>
        </div>
    </main>

    <footer class="site-footer"><span style="font-weight: 600;">&copy; 2026</span>, <span style="font-weight: 600;">Global Mart</span>, <span style="font-weight: 600;">Bhudeb's Project</span></footer>

</body>
</html>
