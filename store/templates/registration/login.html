<!DOCTYPE html>
<html>
<head>
    <title>Login | Global Mart</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 14% 12%, rgba(214, 180, 108, 0.22) 0 12%, transparent 28%),
                radial-gradient(circle at 82% 14%, rgba(245, 214, 164, 0.26) 0 10%, transparent 24%),
                linear-gradient(180deg, #fffaf2 0%, #f4eadb 100%);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .center-shell {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.96);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 24px 48px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
            border: 1px solid rgba(22, 101, 52, 0.12);
            backdrop-filter: blur(18px) saturate(150%);
        }

        .login-box h2 { color: #14532d; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 5px; box-sizing: border-box; background: rgba(255,255,255,0.08); color: #14532d; }
        .btn { width: 100%; background: #14532d; color: #ffffff; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { transform: translateY(-1px); }
        .errorlist { color: #991b1b; list-style: none; padding: 0; font-size: 14px; }

        footer.site-footer {
            margin-top: auto;
            background: transparent;
            color: #6b7280;
            text-align: center;
            padding: 12px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0;
            border-top: none;
            box-shadow: none;
            
        }
    </style>
</head>
<body>
    <main class="center-shell">
        <div class="login-box">
            <h2>Global Mart Login</h2>
            
            <form method="post">
                {% csrf_token %}
                
                {% if form.errors %}
                    <p class="errorlist">Your username or password was incorrect. Please try again.</p>
                {% endif %}

                {{ form.username.label_tag }}
                {{ form.username }}
                
                {{ form.password.label_tag }}
                {{ form.password }}

                <button type="submit" class="btn">Login</button>
            </form>

            <p style="margin-top: 20px; font-size: 14px;">
                New here? <a href="{% url 'signup' %}" style="color: #3498db; text-decoration: none;">Create an account</a>
            </p>
        </div>
    </main>

    <footer class="site-footer"><span style="font-weight: 600;">&copy; 2026</span>, <span style="font-weight: 600;">Global Mart</span>, <span style="font-weight: 600;">Bhudeb's Project</span></footer>
</body>
</html>
